      /* Bouton fermeture de la barre */
      #closeBar {

      #filterBar.collapsed .panel,

      }

      #reopenBar {
        position: absolute;
        bottom: 10px;
        left: 50%;

    <script>
      // FIX BUG 1 + BUG 2 : tout est dans un seul DOMContentLoaded,
      // une seule initialisation de la carte, aucun code exécuté hors listener.
      document.addEventListener("DOMContentLoaded", function () {

        // ===================== CARTE =====================
        window.map = L.map('map', {
          zoomControl: false,
          maxZoom: 28,
          minZoom: 1
        }).fitBounds([
          [48.07448252945995, 6.4036522603343915],
          [49.10792212278178, 9.136373010327908]
        ]);

        const map = window.map;

        // Bounds de la vue globale (pour le reset)
        const DEFAULT_BOUNDS = [[48.07448252945995, 6.4036522603343915], [49.10792212278178, 9.136373010327908]];

        // Zoom sur un cluster Leaflet : attend que les layers soient rendus puis fitBounds.
        // Si aucun marqueur visible, revient à la vue globale.
        function zoomToCluster(cluster) {
          if (cluster.getLayers().length === 0) {
            map.fitBounds(DEFAULT_BOUNDS);
            return;
          }
          const group = L.featureGroup(cluster.getLayers());
          map.fitBounds(group.getBounds().pad(0.1));
        }

        // ===================== UTILITAIRES POPUP =====================
        var autolinker = new Autolinker({ truncate: { length: 30, location: 'smart' } });

        function removeEmptyRowsFromPopupContent(content, feature) {
          var tempDiv = document.createElement('div');
          tempDiv.innerHTML = content;
          var rows = tempDiv.querySelectorAll('tr');
          for (var i = 0; i < rows.length; i++) {
            var td = rows[i].querySelector('td.visible-with-data');
            var key = td ? td.id : '';
            if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
              rows[i].parentNode.removeChild(rows[i]);
            }
          }
          return tempDiv.innerHTML;
        }

        function addClassToPopupIfMedia(content, popup) {
          var tempDiv = document.createElement('div');
          tempDiv.innerHTML = content;
          var imgTd = tempDiv.querySelector('td img');
          if (imgTd) {
            var src = imgTd.getAttribute('src');
            if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
              popup._contentNode.classList.add('media');
              setTimeout(function () { popup.update(); }, 10);
            } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
              var audio = document.createElement('audio');
              audio.controls = true;
              audio.src = src;
              imgTd.parentNode.replaceChild(audio, imgTd);
              popup._contentNode.classList.add('media');
              setTimeout(function () { popup.setContent(tempDiv.innerHTML); popup.update(); }, 10);
            } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
              var video = document.createElement('video');
              video.controls = true;
              video.src = src;
              video.style.width = "400px";
              video.style.height = "300px";
              video.style.maxHeight = "60vh";
              video.style.maxWidth = "60vw";
              imgTd.parentNode.replaceChild(video, imgTd);
              popup._contentNode.classList.add('media');
              video.addEventListener('loadedmetadata', function () { popup.update(); });
              setTimeout(function () { popup.setContent(tempDiv.innerHTML); popup.update(); }, 10);
            } else {
              popup._contentNode.classList.remove('media');
            }
          } else {
            popup._contentNode.classList.remove('media');
          }
        }

        // ===================== CONTRÔLES =====================
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix(
          '<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; ' +
          '<a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; ' +
          '<a href="https://qgis.org">QGIS</a>'
        );

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.locate({ locateOptions: { maxZoom: 19 } }).addTo(map);

        var measureControl = new L.Control.Measure({
          position: 'topleft',
          primaryLengthUnit: 'meters',
          secondaryLengthUnit: 'kilometers',
          primaryAreaUnit: 'sqmeters',
          secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';

        // ===================== COUCHES =====================
        var bounds_group = new L.featureGroup([]);

        function setBounds() {}

        // Fond de carte OSM
        map.createPane('pane_FonddecarteOSMStandard_0');
        map.getPane('pane_FonddecarteOSMStandard_0').style.zIndex = 400;
        var layer_FonddecarteOSMStandard_0 = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
          pane: 'pane_FonddecarteOSMStandard_0',
          opacity: 1.0,
          attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
          minZoom: 1,
          maxZoom: 28,
          minNativeZoom: 0,
          maxNativeZoom: 19
        });
        map.addLayer(layer_FonddecarteOSMStandard_0);

        // ===================== ENTREPRISES =====================
        function pop_QGISBDEntreprises(feature, layer) {
          var p = feature.properties;
          var popupContent = '<table style="font-family:Arial,sans-serif;font-size:13px;border-collapse:collapse;">' +
            '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">Nom</th>' +
              '<td style="padding:3px 0">' + (p['Nom'] || '—') + '</td></tr>' +
            '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">Activité</th>' +
              '<td style="padding:3px 0">' + (p['LibelléNA'] || '—') + '</td></tr>' +
            '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">Adresse</th>' +
              '<td style="padding:3px 0">' + (p['Adresse'] || '—') + '</td></tr>' +
            '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">SIRET</th>' +
              '<td style="padding:3px 0">' + (p['SIRET'] || '—') + '</td></tr>' +
            '</table>';
          layer.bindPopup(popupContent, { maxHeight: 400 });
        }

        function exp_QGISBDEntreprisesrule0_eval_expression(context) {
          return context.feature.properties['NAF2'] == '10';
        }
        function exp_QGISBDEntreprisesrule1_eval_expression(context) {
          return context.feature.properties['NAF2'] == '11';
        }
        function exp_QGISBDEntreprisesrule2_eval_expression(context) {
          return context.feature.properties['NAF2'] == '46';
        }
        function exp_QGISBDEntreprisesrule3_eval_expression(context) {
          return context.feature.properties['NAF2'] == '47';
        }
        function exp_QGISBDEntreprisesrule4_eval_expression(context) {
          return context.feature.properties['NAF2'] == '56';
        }

        function style_QGISBDEntreprises_0(feature) {
          var context = { feature: feature, variables: {} };
          if (exp_QGISBDEntreprisesrule0_eval_expression(context)) {
            return { pane: 'pane_QGISBDEntreprises', radius: 3.0, opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1, fill: true, fillOpacity: 1, fillColor: 'rgba(65,108,163,1.0)', interactive: true };
          } else if (exp_QGISBDEntreprisesrule1_eval_expression(context)) {
            return { pane: 'pane_QGISBDEntreprises', radius: 3.0, opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1, fill: true, fillOpacity: 1, fillColor: 'rgba(0,157,32,1.0)', interactive: true };
          } else if (exp_QGISBDEntreprisesrule2_eval_expression(context)) {
            return { pane: 'pane_QGISBDEntreprises', radius: 3.0, opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1, fill: true, fillOpacity: 1, fillColor: 'rgba(221,28,119,1.0)', interactive: true };
          } else if (exp_QGISBDEntreprisesrule3_eval_expression(context)) {
            return { pane: 'pane_QGISBDEntreprises', radius: 3.0, opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1, fill: true, fillOpacity: 1, fillColor: 'rgba(255,158,23,1.0)', interactive: true };
          } else if (exp_QGISBDEntreprisesrule4_eval_expression(context)) {
            return { pane: 'pane_QGISBDEntreprises', radius: 3.0, opacity: 1, color: 'rgba(35,35,35,1.0)', dashArray: '', lineCap: 'butt', lineJoin: 'miter', weight: 1, fill: true, fillOpacity: 1, fillColor: 'rgba(0,0,0,1.0)', interactive: true };
          } else {
            return { fill: false, stroke: false };
          }
        }

        map.createPane('pane_QGISBDEntreprises');
        map.getPane('pane_QGISBDEntreprises').style.zIndex = 401;
        map.getPane('pane_QGISBDEntreprises').style['mix-blend-mode'] = 'normal';
        var layer_QGISBDEntreprises = new L.geoJson(entreprises, {
          attribution: '',
          interactive: true,
          dataVar: 'entreprises',
          layerName: 'layer_QGISBDEntreprises',
          pane: 'pane_QGISBDEntreprises',
          onEachFeature: pop_QGISBDEntreprises,
          pointToLayer: function (feature, latlng) {
            var context = { feature: feature, variables: {} };
            return L.circleMarker(latlng, style_QGISBDEntreprises_0(feature));
          }
        });
        var cluster_QGISBDEntreprises = new L.MarkerClusterGroup({ showCoverageOnHover: false, spiderfyDistanceMultiplier: 2 });
        cluster_QGISBDEntreprises.addLayer(layer_QGISBDEntreprises);
        bounds_group.addLayer(layer_QGISBDEntreprises);
        cluster_QGISBDEntreprises.addTo(map);

        // ===================== ENSEIGNEMENT =====================
        function pop_QGISBDEnseignement(feature, layer) {
          var p = feature.properties;

        // Génère un DivIcon SVG étoile à 5 branches, centré sur 20×20 px.
        function makeStarIcon(fillColor) {
          var cx = 10, cy = 10, r = 8, ri = 3.5, pts = [];
          for (var i = 0; i < 10; i++) {
            var angle = (Math.PI / 5) * i - Math.PI / 2;
            var radius = (i % 2 === 0) ? r : ri;
            pts.push((cx + radius * Math.cos(angle)).toFixed(2) + ',' +
                     (cy + radius * Math.sin(angle)).toFixed(2));
          }
          var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">' +
            '<polygon points="' + pts.join(' ') + '" ' +
            'fill="' + fillColor + '" stroke="#232323" stroke-width="1" stroke-linejoin="round"/>' +
            '</svg>';
          return L.divIcon({
            html: svg,
            className: '',
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, -10]
          });
        }

                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(213,68,109,1.0);border:1px solid #333;"></span></td><td>Etab. Expérimental Enfance Handicapée</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(227,78,101,1.0);border:1px solid #333;"></span></td><td>Etab. Enfants/Ados Polyhandicapés</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(238,91,95,1.0);border:1px solid #333;"></span></td><td>Etab. Sanitaire Prisons</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(245,108,92,1.0);border:1px solid #333;"></span></td><td>Etab. Thermal</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(250,126,94,1.0);border:1px solid #333;"></span></td><td>F.A.M.</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(252,144,101,1.0);border:1px solid #333;"></span></td><td>Foyer Hébergement Adultes Handicapés</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(254,163,111,1.0);border:1px solid #333;"></span></td><td>Foyer Travailleurs Migrants</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(254,181,124,1.0);border:1px solid #333;"></span></td><td>I.T.E.P.</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(254,199,139,1.0);border:1px solid #333;"></span></td><td>M.A.S.</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(254,217,155,1.0);border:1px solid #333;"></span></td><td>Maison d\'Enfants à Caractère Social</td></tr>\
                    <tr><td style="text-align:center;"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:rgba(253,235,172,1.0);border:1px solid #333;"></span></td><td>Maison de naissance</td></tr>\
                    </table>', layer: cluster_Hopitaux }
            ]
          },
          { label: "Fond de carte : OSM Standard", layer: layer_FonddecarteOSMStandard_0, radioGroup: 'bm' }
        ];

        var lay = L.control.layers.tree(null, overlaysTree, {
            collapseAll: '▲ Tout réduire',
            expandAll: '▼ Tout déployer',
            collapsed: true,
        });
        lay.addTo(map);

        // Gestion hauteur du panneau couches
        function newLayersListHeight() {
          var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
          if (layerScrollbarElement) {
            var layersListElement = document.querySelector('.leaflet-control-layers-list');
            var originalHeight = layersListElement.style.height || window.getComputedStyle(layersListElement).height;
            var newHeight = parseFloat(originalHeight) - 50;
            layersListElement.style.height = newHeight + 'px';
          }
        }

        var isLayersListExpanded = true;
        var controlLayersElement = document.querySelector('.leaflet-control-layers');
        var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');

        toggleLayerControl.addEventListener('click', function () {
          if (isLayersListExpanded) {
            controlLayersElement.classList.remove('leaflet-control-layers-expanded');
          } else {
            controlLayersElement.classList.add('leaflet-control-layers-expanded');
          }
          isLayersListExpanded = !isLayersListExpanded;
          newLayersListHeight();
        });

        if (controlLayersElement) {
          controlLayersElement.addEventListener('click', function (event) {
            var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
            if (toggleLayerHeaderPointer) { newLayersListHeight(); }
          });
        }

        setTimeout(function () { toggleLayerControl.click(); }, 10);
        setTimeout(function () { toggleLayerControl.click(); }, 10);

        var isSmallScreen = window.innerWidth < 650;
        if (isSmallScreen) {
          setTimeout(function () {
            controlLayersElement.classList.remove('leaflet-control-layers-expanded');
            isLayersListExpanded = !isLayersListExpanded;
          }, 500);
        }

        setBounds();

        // ===================== STATE FILTRES =====================
        const etpLayer = cluster_QGISBDEntreprises;
        const esgtLayer = cluster_QGISBDEnseignement;

        const etpState = { naf2: "all", types: new Set(), data: [] };
        const esgtState = { niveau: "all", cantine: "all" };

        // ===================== TABS =====================
        const tabEtp = document.getElementById("tabEtp");
        const tabEsgt = document.getElementById("tabEsgt");
        const tabSante = document.getElementById("tabSante");
        const panelEtp = document.getElementById("panelEtp");
        const panelEsgt = document.getElementById("panelEsgt");
        const panelSante = document.getElementById("panelSante");

        function showTab(activeTab) {
          [tabEtp, tabEsgt, tabSante].forEach(t => t.classList.remove("active"));
          [panelEtp, panelEsgt, panelSante].forEach(p => p.classList.add("hidden"));
          activeTab.classList.add("active");
          if (activeTab === tabEtp) panelEtp.classList.remove("hidden");
          else if (activeTab === tabEsgt) panelEsgt.classList.remove("hidden");
          else if (activeTab === tabSante) panelSante.classList.remove("hidden");
        }

        tabEtp.onclick = () => { if (!tabEtp.disabled) showTab(tabEtp); };
        tabEsgt.onclick = () => { if (!tabEsgt.disabled) showTab(tabEsgt); };
        tabSante.onclick = () => { if (!tabSante.disabled) showTab(tabSante); };

        // Synchronise l'état des onglets avec la visibilité des couches Leaflet.
        // Appelée à chaque fois qu'une couche est ajoutée ou retirée de la carte.
        function syncTabs() {
          const etpVisible = map.hasLayer(cluster_QGISBDEntreprises);
          const esgtVisible = map.hasLayer(cluster_QGISBDEnseignement);
          const santeVisible = map.hasLayer(cluster_EHPAD) || map.hasLayer(cluster_Hopitaux);

          tabEtp.disabled = !etpVisible;
          tabEsgt.disabled = !esgtVisible;
          tabSante.disabled = !santeVisible;

          // Si l'onglet actif devient invisible, basculer sur le premier visible
          const activeTab = [tabEtp, tabEsgt, tabSante].find(t => t.classList.contains("active"));
          if (activeTab && activeTab.disabled) {
            const next = [tabEtp, tabEsgt, tabSante].find(t => !t.disabled);
            if (next) showTab(next);
            else [panelEtp, panelEsgt, panelSante].forEach(p => p.classList.add("hidden"));
          }

          // Masquer/afficher la barre entière selon qu'il reste des onglets actifs
          const anyVisible = etpVisible || esgtVisible || santeVisible;
          const tabsEl = document.getElementById("tabs");
          if (!anyVisible) {
            tabsEl.style.display = "none";
            [panelEtp, panelEsgt, panelSante].forEach(p => p.classList.add("hidden"));
          } else {
            tabsEl.style.display = "";
            // S'assurer qu'un onglet est actif
            const stillActive = [tabEtp, tabEsgt, tabSante].find(t => t.classList.contains("active") && !t.disabled);
            if (!stillActive) {
              const next = [tabEtp, tabEsgt, tabSante].find(t => !t.disabled);
              if (next) showTab(next);
            }
          }
        }

        // Synchronisation onglets ↔ couches : activée
        map.on("layeradd layerremove", syncTabs);

        // ===================== FERMETURE / RÉOUVERTURE DE LA BARRE =====================
        const filterBar = document.getElementById("filterBar");
        const reopenBar = document.getElementById("reopenBar");

        document.getElementById("closeBar").onclick = () => {
          filterBar.classList.add("collapsed");
          reopenBar.style.display = "block";
        };

        reopenBar.onclick = () => {
          filterBar.classList.remove("collapsed");
          reopenBar.style.display = "none";
        };

        // ===================== FILTRES ENTREPRISES =====================
        // On itère sur le GeoJSON brut (layer_QGISBDEntreprises),
        // pas sur le cluster — eachLayer() d'un MarkerClusterGroup ne renvoie
        // pas les marqueurs individuels mais ses sous-groupes internes.
        // Reconstruit la liste des typologies en tenant compte du filtre NAF2 actif.
        // Affiche chaque entrée sous la forme "Code NAF - LibelléNA".
        function buildTypes() {
          const box = document.getElementById("typeCheckboxes");
          box.innerHTML = "";
          etpState.types.clear();

          // Ne garder que les données compatibles avec le filtre NAF2 courant
          const filtered = etpState.naf2 === "all"
            ? etpState.data
            : etpState.data.filter(d => String(d.NAF2) === String(etpState.naf2));

          // Dédoublonner par LibelléNA et conserver le code NAF associé.
          // Le code NAF à 5 caractères (ex: "1013A") peut se trouver dans différents
          // champs selon l'export QGIS : "NAF", "NAFA", "Code NAF", "apet700", etc.
          // On cherche le premier champ disponible parmi les candidats courants.
          const nafFieldCandidates = ["NAF", "NAFA", "Code NAF", "apet700", "code_naf", "CodeNAF", "naf"];
          const nafField = nafFieldCandidates.find(f => filtered.some(d => d[f])) || null;

          const uniques = [...new Map(filtered.map(d => [d["LibelléNA"], d])).values()]
            .sort((a, b) => {
              const ca = nafField ? (a[nafField] || "") : "";
              const cb = nafField ? (b[nafField] || "") : "";
              return ca.localeCompare(cb);
            });

          uniques.forEach(d => {
            if (!d["LibelléNA"]) return;
            const code = nafField ? d[nafField] : null;
            const label = code ? `${code} - ${d["LibelléNA"]}` : d["LibelléNA"];
            const div = document.createElement("div");
            div.innerHTML = `<label><input type="checkbox" value="${d["LibelléNA"]}"> ${label}</label>`;
            div.querySelector("input").onchange = (e) => {
              if (e.target.checked) etpState.types.add(e.target.value);
              else etpState.types.delete(e.target.value);
              filterEtp();
            };
            box.appendChild(div);
          });
        }

        function filterEtp(zoom = true) {
          let count = 0;
          cluster_QGISBDEntreprises.clearLayers();
          layer_QGISBDEntreprises.eachLayer(layer => {
            const p = layer.feature.properties;
            const okNAF = etpState.naf2 === "all" || String(p.NAF2) === String(etpState.naf2);
            const okType = etpState.types.size === 0 || etpState.types.has(p["LibelléNA"]);
            if (okNAF && okType) {
              cluster_QGISBDEntreprises.addLayer(layer);
              count++;
            }
          });
          document.getElementById("compteurEtp").textContent = count + " entreprises";
          if (zoom) zoomToCluster(cluster_QGISBDEntreprises);
        }

        function initEtp() {
          etpState.data = [];
          layer_QGISBDEntreprises.eachLayer(l => etpState.data.push(l.feature.properties));
          buildTypes();
          filterEtp(false);
        }

        // ===================== FILTRES ENSEIGNEMENT =====================
        // Même logique : itérer sur le GeoJSON brut, pas sur le cluster
        function filterEsgt(zoom = true) {
          let count = 0;
          cluster_QGISBDEnseignement.clearLayers();
          layer_QGISBDEnseignement.eachLayer(layer => {
            const p = layer.feature.properties;
            const okNiveau = esgtState.niveau === "all" || p.Type_etablissement === esgtState.niveau;
            const restBool = p.Restauration === true || String(p.Restauration).toLowerCase() === 'true' || String(p.Restauration).toLowerCase() === 'oui';
            const okCantine = esgtState.cantine === "all"
              || (esgtState.cantine === "true" && restBool)
              || (esgtState.cantine === "false" && !restBool);
            if (okNiveau && okCantine) {
              cluster_QGISBDEnseignement.addLayer(layer);
              count++;
            }
          });
          document.getElementById("compteurEsgt").textContent = count + " établissements";
          if (zoom) zoomToCluster(cluster_QGISBDEnseignement);
        }

        // ===================== ÉVÉNEMENTS =====================
        document.getElementById("FiltreNAF2").onchange = (e) => {
          etpState.naf2 = e.target.value;
          buildTypes();   // reconstruire la liste filtrée des typologies
          filterEtp();
        };
        document.getElementById("FiltreNiveau").onchange = (e) => { esgtState.niveau = e.target.value; filterEsgt(); };
        document.getElementById("FiltreCantine").onchange = (e) => { esgtState.cantine = e.target.value; filterEsgt(); };

        document.getElementById("resetEtp").onclick = () => {
          etpState.naf2 = "all";
          etpState.types.clear();
          document.getElementById("FiltreNAF2").value = "all";
          document.querySelectorAll("#typeCheckboxes input").forEach(cb => cb.checked = false);
          buildTypes();
          filterEtp(false);          // pas de zoom auto
          map.fitBounds(DEFAULT_BOUNDS);  // retour vue globale
        };

        document.getElementById("exportEtp").onclick = () => {
          const rows = [["SIRET", "Nom entreprise", "Adresse", "NAF2", "Code NAF", "LibelléNA"]];
          layer_QGISBDEntreprises.eachLayer(layer => {
            const p = layer.feature.properties;
            const okNAF = etpState.naf2 === "all" || String(p.NAF2) === String(etpState.naf2);
            const okType = etpState.types.size === 0 || etpState.types.has(p["LibelléNA"]);
            if (okNAF && okType) {
              rows.push([
                p.SIRET ?? "",
                p["Nom entrep"] ?? "",
                p.Adresse ?? "",
                p.NAF2 ?? "",
                p.NAF ?? "",
                p["LibelléNA"] ?? ""
              ]);
            }
          });
          const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "export_entreprises.csv";
          a.click();
        };

        document.getElementById("resetEsgt").onclick = () => {
          esgtState.niveau = "all";
          esgtState.cantine = "all";
          document.getElementById("FiltreNiveau").value = "all";
          document.getElementById("FiltreCantine").value = "all";
          filterEsgt(false);         // pas de zoom auto
          map.fitBounds(DEFAULT_BOUNDS);  // retour vue globale
        };

        document.getElementById("exportEsgt").onclick = () => {
          const rows = [["Identifiant", "Nom établissement", "Type", "Statut", "Adresse", "CP", "Commune", "Restauration", "Nb élèves", "SIREN/SIRET"]];
          layer_QGISBDEnseignement.eachLayer(layer => {
            const p = layer.feature.properties;
            const okNiveau = esgtState.niveau === "all" || p.Type_etablissement === esgtState.niveau;
            // Normalise espaces et casse des deux côtés pour éviter les faux non-matchs
            const restBool2 = p.Restauration === true || String(p.Restauration).toLowerCase() === 'true' || String(p.Restauration).toLowerCase() === 'oui';
            const okCantine = esgtState.cantine === "all"
              || (esgtState.cantine === "true" && restBool2)
              || (esgtState.cantine === "false" && !restBool2);
            if (okNiveau && okCantine) {
              rows.push([
                p.Identifiant_de_l_etablissement ?? "",
                p.Nom_etablissement ?? "",
                p.Type_etablissement ?? "",
                p.Statut_public_prive ?? "",
                p.Adresse_1 ?? "",
                p.Code_postal ?? "",
                p.Nom_commune ?? "",
                p.Restauration ?? "",
                p.Effectifs ?? "",
                p.SIREN_SIRET ?? ""
              ]);
            }
          });
          const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
          const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "export_enseignement.csv";
          a.click();
        };

        document.getElementById("searchType").oninput = (e) => {
          const q = e.target.value.toLowerCase();
          document.querySelectorAll("#typeCheckboxes label").forEach(label => {
            label.style.display = label.textContent.toLowerCase().includes(q) ? "" : "none";
          });
        };

        // ===================== FILTRES SANTÉ & SOCIAL =====================
        function getCheckedSante() {
          var checked = [];
          document.querySelectorAll(".sante-cb:checked").forEach(function(cb) { checked.push(cb.value); });
          return checked;
        }

        function applyFiltersSante() {
          var checked = getCheckedSante();
          var showEHPAD = checked.indexOf("EHPAD") !== -1;

          map.removeLayer(cluster_EHPAD);
          cluster_EHPAD.clearLayers();
          if (showEHPAD) {
            var geoEHPAD = new L.geoJson(santesocial1, {
              interactive: true, pane: "pane_EHPAD", onEachFeature: pop_EHPAD,
              pointToLayer: function(feature, latlng) { return L.shapeMarker(latlng, style_EHPAD(feature)); }
            });
            cluster_EHPAD.addLayer(geoEHPAD);
            cluster_EHPAD.addTo(map);
          }

          map.removeLayer(cluster_Hopitaux);
          cluster_Hopitaux.clearLayers();
          var geoHop = new L.geoJson(santesocial2, {
            interactive: true, pane: "pane_Hopitaux", onEachFeature: pop_Hopitaux,
            pointToLayer: function(feature, latlng) { return L.circleMarker(latlng, style_Hopitaux(feature)); },
            filter: function(feature) {
              return checked.indexOf(String(feature.properties["Acivité FINESS"] || "")) !== -1;
            }
          });
          cluster_Hopitaux.addLayer(geoHop);
          cluster_Hopitaux.addTo(map);

          var totalEHPAD = showEHPAD ? (santesocial1.features ? santesocial1.features.length : 0) : 0;
          var totalHop = 0;
          if (santesocial2 && santesocial2.features) {
            santesocial2.features.forEach(function(f) {
              if (checked.indexOf(String(f.properties["Acivité FINESS"] || "")) !== -1) totalHop++;
            });
          }
          document.getElementById("compteurSante").textContent = (totalEHPAD + totalHop) + " établissement(s)";
        }

        document.querySelectorAll(".sante-cb").forEach(function(cb) {
          cb.onchange = applyFiltersSante;
        });

        document.getElementById("santeSelectAll").onclick = function() {
          document.querySelectorAll(".sante-cb").forEach(function(cb) { cb.checked = true; });
          applyFiltersSante();
        };
        document.getElementById("santeDeselectAll").onclick = function() {
          document.querySelectorAll(".sante-cb").forEach(function(cb) { cb.checked = false; });
          applyFiltersSante();
        };
        document.getElementById("resetSante").onclick = function() {
          document.querySelectorAll(".sante-cb").forEach(function(cb) { cb.checked = true; });
          applyFiltersSante();
          map.fitBounds(DEFAULT_BOUNDS);
        };

        document.getElementById("exportSante").onclick = function() {
          var rows = [["Type", "Nom", "SIRET", "FINESS", "Adresse", "Code NAF", "Activité FINESS", "Prestataire (NAF 56)"]];
          var checked = [];
          document.querySelectorAll(".sante-cb:checked").forEach(function(cb) { checked.push(cb.value); });
          if (checked.indexOf("EHPAD") !== -1 && santesocial1 && santesocial1.features) {
            santesocial1.features.forEach(function(f) {
              var p = f.properties;
              rows.push(["EHPAD", p["Nom"] ?? "", p["SIRET"] ?? "", "", p["Adresse"] ?? "", p["Code NAF"] ?? "", "", p["Prestataire (NAF 56)"] ?? ""]);
            });
          }
          if (santesocial2 && santesocial2.features) {
            santesocial2.features.forEach(function(f) {
              var p = f.properties;
              if (checked.indexOf(String(p["Acivité FINESS"] || "")) !== -1) {
                rows.push([p["Acivité FINESS"] ?? "", p["Nom"] ?? "", p["SIRET"] ?? "", p["FINESS"] ?? "", p["Adresse"] ?? "", p["Code NAF"] ?? "", p["Acivité FINESS"] ?? "", p["Prestataire (NAF 56)"] ?? ""]);
              }
            });
          }
          var csv = rows.map(function(r) { return r.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(";"); }).join("\n");
          var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "export_sante_social.csv";
          a.click();
        };

        // ===================== INITIALISATION =====================
        setTimeout(() => {
          initEtp();
          filterEsgt(false);
          applyFiltersSante();
        }, 300);

      }); // fin DOMContentLoaded
    </script>
