<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <link rel="stylesheet" href="css/leaflet-measure.css">
        <style>
        #titre-carte {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: white;
            padding: 8px 16px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Gestion des biodéchets des ménages – Bas-Rhin</title>
    </head>
    <body>
        <div id="titre-carte">Gestion des biodéchets des ménages – Bas-Rhin</div>
        <div id="map"></div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>

        <!-- Données géographiques -->
        <script src="data/EPCI_1.js"></script>
        <script src="data/DpartementduBasRhin_2.js"></script>
        <script src="data/EPCIDchetsdesmnages_3.js"></script>

        <script>

        var map = L.map('map', {
            zoomControl: false, maxZoom: 28, minZoom: 1
        }).fitBounds([[48.037747419521914, 6.3464966678394], [49.129580456936665, 9.23247855462383]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() { popup.update(); }, 10);
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';

        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        // ===== FOND DE CARTE =====
        map.createPane('pane_FonddecarteOSMStandard_0');
        map.getPane('pane_FonddecarteOSMStandard_0').style.zIndex = 400;
        var layer_FonddecarteOSMStandard_0 = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            pane: 'pane_FonddecarteOSMStandard_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 19
        });
        map.addLayer(layer_FonddecarteOSMStandard_0);

        // ===== EPCI (contours) =====
        function pop_EPCI_1(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">EPCI_CODE</th>\
                        <td class="visible-with-data" id="EPCI_CODE">' + (feature.properties['EPCI_CODE'] !== null ? autolinker.link(String(feature.properties['EPCI_CODE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">EPCI</th>\
                        <td class="visible-with-data" id="EPCI">' + (feature.properties['EPCI'] !== null ? autolinker.link(String(feature.properties['EPCI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">N_POP</th>\
                        <td class="visible-with-data" id="N_POP">' + (feature.properties['N_POP'] !== null ? autolinker.link(String(feature.properties['N_POP']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">NB_COM</th>\
                        <td class="visible-with-data" id="NB_COM">' + (feature.properties['NB_COM'] !== null ? autolinker.link(String(feature.properties['NB_COM']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">REG_CODE</th>\
                        <td class="visible-with-data" id="REG_CODE">' + (feature.properties['REG_CODE'] !== null ? autolinker.link(String(feature.properties['REG_CODE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">DEPT_CODE</th>\
                        <td class="visible-with-data" id="DEPT_CODE">' + (feature.properties['DEPT_CODE'] !== null ? autolinker.link(String(feature.properties['DEPT_CODE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_EPCI_1_0() {
            return {
                pane: 'pane_EPCI_1',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_EPCI_1');
        map.getPane('pane_EPCI_1').style.zIndex = 401;
        map.getPane('pane_EPCI_1').style['mix-blend-mode'] = 'normal';
        var layer_EPCI_1 = new L.geoJson(json_EPCI_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_EPCI_1',
            layerName: 'layer_EPCI_1',
            pane: 'pane_EPCI_1',
            onEachFeature: pop_EPCI_1,
            style: style_EPCI_1_0,
        });
        bounds_group.addLayer(layer_EPCI_1);
        map.addLayer(layer_EPCI_1);

        // ===== DÉPARTEMENT DU BAS-RHIN =====
        function pop_DpartementduBasRhin_2(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">code_insee</th>\
                        <td class="visible-with-data" id="code_insee">' + (feature.properties['code_insee'] !== null ? autolinker.link(String(feature.properties['code_insee']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">nom</th>\
                        <td class="visible-with-data" id="nom">' + (feature.properties['nom'] !== null ? autolinker.link(String(feature.properties['nom']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">nuts3</th>\
                        <td class="visible-with-data" id="nuts3">' + (feature.properties['nuts3'] !== null ? autolinker.link(String(feature.properties['nuts3']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">wikipedia</th>\
                        <td class="visible-with-data" id="wikipedia">' + (feature.properties['wikipedia'] !== null ? autolinker.link(String(feature.properties['wikipedia']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">surf_km2</th>\
                        <td class="visible-with-data" id="surf_km2">' + (feature.properties['surf_km2'] !== null ? autolinker.link(String(feature.properties['surf_km2']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_DpartementduBasRhin_2_0() {
            return {
                pane: 'pane_DpartementduBasRhin_2',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 3.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_DpartementduBasRhin_2');
        map.getPane('pane_DpartementduBasRhin_2').style.zIndex = 402;
        map.getPane('pane_DpartementduBasRhin_2').style['mix-blend-mode'] = 'normal';
        var layer_DpartementduBasRhin_2 = new L.geoJson(json_DpartementduBasRhin_2, {
            attribution: '',
            interactive: false,
            dataVar: 'json_DpartementduBasRhin_2',
            layerName: 'layer_DpartementduBasRhin_2',
            pane: 'pane_DpartementduBasRhin_2',
            onEachFeature: pop_DpartementduBasRhin_2,
            style: style_DpartementduBasRhin_2_0,
        });
        bounds_group.addLayer(layer_DpartementduBasRhin_2);
        map.addLayer(layer_DpartementduBasRhin_2);

        // ===== EPCI – DÉCHETS DES MÉNAGES =====
        function pop_EPCIDchetsdesmnages_3(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <th scope="row">EPCI_CODE</th>\
                        <td class="visible-with-data" id="EPCI_CODE">' + (feature.properties['EPCI_CODE'] !== null ? autolinker.link(String(feature.properties['EPCI_CODE']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">EPCI</th>\
                        <td class="visible-with-data" id="EPCI">' + (feature.properties['EPCI'] !== null ? autolinker.link(String(feature.properties['EPCI']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Communes</th>\
                        <td class="visible-with-data" id="Communes">' + (feature.properties['Communes'] !== null ? autolinker.link(String(feature.properties['Communes']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Population</th>\
                        <td class="visible-with-data" id="Population">' + (feature.properties['Population'] !== null ? autolinker.link(String(feature.properties['Population']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Syndicat</th>\
                        <td class="visible-with-data" id="Syndicat">' + (feature.properties['Syndicat'] !== null ? autolinker.link(String(feature.properties['Syndicat']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Collecteur</th>\
                        <td class="visible-with-data" id="Collecteur">' + (feature.properties['Collecteur'] !== null ? autolinker.link(String(feature.properties['Collecteur']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Méthode</th>\
                        <td class="visible-with-data" id="Méthode">' + (feature.properties['Méthode'] !== null ? autolinker.link(String(feature.properties['Méthode']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">Traitement</th>\
                        <td class="visible-with-data" id="Traitement">' + (feature.properties['Traitement'] !== null ? autolinker.link(String(feature.properties['Traitement']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_EPCIDchetsdesmnages_3_0(feature) {
            switch(String(feature.properties['Collecteur'])) {
                case 'Agrivalor':
                    return {
                        pane: 'pane_EPCIDchetsdesmnages_3',
                        opacity: 1,
                        color: 'rgba(35,35,35,1.0)',
                        dashArray: '',
                        lineCap: 'butt',
                        lineJoin: 'miter',
                        weight: 1.0,
                        fill: true,
                        fillOpacity: 1,
                        fillColor: 'rgba(216,216,216,1.0)',
                        interactive: true,
                    }
                    break;
                case 'Ecodéchets':
                    return {
                        pane: 'pane_EPCIDchetsdesmnages_3',
                        opacity: 1,
                        color: 'rgba(35,35,35,1.0)',
                        dashArray: '',
                        lineCap: 'butt',
                        lineJoin: 'miter',
                        weight: 1.0,
                        fill: true,
                        fillOpacity: 1,
                        fillColor: 'rgba(142,86,237,1.0)',
                        interactive: true,
                    }
                    break;
                case 'Select\'om':
                    return {
                        pane: 'pane_EPCIDchetsdesmnages_3',
                        opacity: 1,
                        color: 'rgba(35,35,35,1.0)',
                        dashArray: '',
                        lineCap: 'butt',
                        lineJoin: 'miter',
                        weight: 1.0,
                        fill: true,
                        fillOpacity: 1,
                        fillColor: 'rgba(64,150,200,1.0)',
                        interactive: true,
                    }
                    break;
                case 'SEPUR - Govalo':
                    return {
                        pane: 'pane_EPCIDchetsdesmnages_3',
                        opacity: 1,
                        color: 'rgba(35,35,35,1.0)',
                        dashArray: '',
                        lineCap: 'butt',
                        lineJoin: 'miter',
                        weight: 1.0,
                        fill: true,
                        fillOpacity: 1,
                        fillColor: 'rgba(255,127,0,1.0)',
                        interactive: true,
                    }
                    break;
                case 'Suez':
                    return {
                        pane: 'pane_EPCIDchetsdesmnages_3',
                        opacity: 1,
                        color: 'rgba(35,35,35,1.0)',
                        dashArray: '',
                        lineCap: 'butt',
                        lineJoin: 'miter',
                        weight: 1.0,
                        fill: true,
                        fillOpacity: 1,
                        fillColor: 'rgba(129,226,28,1.0)',
                        interactive: true,
                    }
                    break;
                case 'Véolia par Agrivalor':
                    return {
                        pane: 'pane_EPCIDchetsdesmnages_3',
                        opacity: 1,
                        color: 'rgba(35,35,35,1.0)',
                        dashArray: '',
                        lineCap: 'butt',
                        lineJoin: 'miter',
                        weight: 1.0,
                        fill: true,
                        fillOpacity: 1,
                        fillColor: 'rgba(227,26,28,1.0)',
                        interactive: true,
                    }
                    break;
            }
        }
        map.createPane('pane_EPCIDchetsdesmnages_3');
        map.getPane('pane_EPCIDchetsdesmnages_3').style.zIndex = 403;
        map.getPane('pane_EPCIDchetsdesmnages_3').style['mix-blend-mode'] = 'normal';
        var layer_EPCIDchetsdesmnages_3 = new L.geoJson(json_EPCIDchetsdesmnages_3, {
            attribution: '',
            interactive: true,
            dataVar: 'json_EPCIDchetsdesmnages_3',
            layerName: 'layer_EPCIDchetsdesmnages_3',
            pane: 'pane_EPCIDchetsdesmnages_3',
            onEachFeature: pop_EPCIDchetsdesmnages_3,
            style: style_EPCIDchetsdesmnages_3_0,
        });
        bounds_group.addLayer(layer_EPCIDchetsdesmnages_3);
        map.addLayer(layer_EPCIDchetsdesmnages_3);

        // ===== PANNEAU DE COUCHES =====
        var overlaysTree = [
            {label: '<b>Collectivités</b>', selectAllCheckbox: true, children: [
                {label: 'EPCI - Déchets des ménages<br /><table><tr><td style="text-align: center;"><img src="legend/EPCIDchetsdesmnages_3_Agrivalor0.png" /></td><td>Agrivalor</td></tr><tr><td style="text-align: center;"><img src="legend/EPCIDchetsdesmnages_3_Ecodéchets1.png" /></td><td>Ecodéchets</td></tr><tr><td style="text-align: center;"><img src="legend/EPCIDchetsdesmnages_3_Selectom2.png" /></td><td>Select\'om</td></tr><tr><td style="text-align: center;"><img src="legend/EPCIDchetsdesmnages_3_SEPURGovalo3.png" /></td><td>SEPUR - Govalo</td></tr><tr><td style="text-align: center;"><img src="legend/EPCIDchetsdesmnages_3_Suez4.png" /></td><td>Suez</td></tr><tr><td style="text-align: center;"><img src="legend/EPCIDchetsdesmnages_3_VéoliaparAgrivalor5.png" /></td><td>Véolia par Agrivalor</td></tr></table>', layer: layer_EPCIDchetsdesmnages_3},
            ]},
            {label: '<b>Géographie</b>', selectAllCheckbox: true, children: [
                {label: '<img src="legend/DpartementduBasRhin_2.png" /> Département du Bas-Rhin', layer: layer_DpartementduBasRhin_2},
                {label: '<img src="legend/EPCI_1.png" /> EPCI', layer: layer_EPCI_1},
            ]},
            {label: "Fond de carte : OSM Standard", layer: layer_FonddecarteOSMStandard_0, radioGroup: 'bm'},
        ];
        var lay = L.control.layers.tree(null, overlaysTree, {
            collapseAll: '▲ Tout réduire',
            expandAll: '▼ Tout déployer',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();

        </script>
    </body>
</html>
