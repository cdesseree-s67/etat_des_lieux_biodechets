html, body, #map {

#Titre-carte {

}

#exportCSV {

        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        // Génère un DivIcon SVG étoile à 5 branches, centré sur 20x20 px.
        function makeStarIcon(fillColor) {
          var cx = 10, cy = 10, r = 8, ri = 3.5, pts = [];
          for (var i = 0; i < 10; i++) {
            var angle = (Math.PI / 5) * i - Math.PI / 2;
            var radius = (i % 2 === 0) ? r : ri;
            pts.push((cx + radius * Math.cos(angle)).toFixed(2) + ',' +
                     (cy + radius * Math.sin(angle)).toFixed(2));
          }
          var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">' +
            '<polygon points="' + pts.join(' ') + '" ' +
            'fill="' + fillColor + '" stroke="#232323" stroke-width="1" stroke-linejoin="round"/>' +
            '</svg>';
          return L.divIcon({
            html: svg,
            className: '',
            iconSize: [20, 20],
            iconAnchor: [10, 10],
            popupAnchor: [0, -10]
          });
        }

            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen

            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        setBounds();


// ======================= CONFIG ==========================
var enseignementLayer = layer_Restaurationscolaire_14;
var fieldNiveau = "Type_etablissement";
var fieldCantine = "Restauration";

// ==================== STATE ========================
const stateEsgt = { 
  Niveau: "all", 
  Cantine: "all",
  visible: true,
  filtered: []
};

// ================= FILTRES ========================
function filtrerEsgt() {
  let count = 0;
  stateEsgt.filtered = [];

  // Vider le cluster, puis réinsérer uniquement les layers qui passent le filtre
  cluster_Restaurationscolaire_14.clearLayers();

  layer_Restaurationscolaire_14.eachLayer(layer => {
    const p = layer.feature.properties;

    // ===== NIVEAU =====
    const okNiveau = (stateEsgt.Niveau === "all") ||
                     (p[fieldNiveau] == stateEsgt.Niveau);

    // ===== CANTINE =====
    const okCantine = (stateEsgt.Cantine === "all") ||
                      (String(p[fieldCantine]).toLowerCase() === stateEsgt.Cantine);

    // ===== RESULTAT =====
    if (okNiveau && okCantine) {
      cluster_Restaurationscolaire_14.addLayer(layer);
      stateEsgt.filtered.push(p);
      count++;
    }
  });

  document.getElementById("compteurEsgt").textContent =
    count + " établissement" + (count > 1 ? "s" : "");
}

// ================= UI ========================
function bindUIEsgt() {
  document.getElementById("FiltreNiveau")
    .addEventListener("change", e => {
      stateEsgt.Niveau = e.target.value;
      filtrerEsgt();
    });

  document.getElementById("FiltreCantine")
    .addEventListener("change", e => {
      stateEsgt.Cantine = e.target.value;
      filtrerEsgt();
    });

  document.getElementById("resetFiltreEsgt")
    .addEventListener("click", () => {
      stateEsgt.Niveau = "all";
      stateEsgt.Cantine = "all";

      document.getElementById("FiltreNiveau").value = "all";
      document.getElementById("FiltreCantine").value = "all";

      filtrerEsgt();
    });

  document.getElementById("cacherFiltreEsgtBtn")
    .addEventListener("click", cacherFiltreEsgt);
}

// ================= CACHER ========================
function cacherFiltreEsgt() {
  const panel = document.getElementById("FiltreEsgt"); 
  stateEsgt.visible = !stateEsgt.visible;

  if (stateEsgt.visible) {
    panel.classList.remove("hidden");
    document.getElementById("cacherFiltreEsgtBtn").textContent = "▼";
  } else {
    panel.classList.add("hidden");
    document.getElementById("cacherFiltreEsgtBtn").textContent = "▲";
  }
}

// ================= EXPORT ========================
function exportCSV() {
  if (!stateEsgt.filtered.length) {
    alert("Aucune donnée à exporter");
    return;
  }

  const headers = Object.keys(stateEsgt.filtered[0]);
  const csv = [
    headers.join(";"),
    ...stateEsgt.filtered.map(row =>
      headers.map(h =>
        `"${(row[h] ?? "").toString().replace(/"/g, '""')}"`
      ).join(";")
    )
  ].join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "export.csv";
  a.click();
}

// ================= INIT ========================
map.whenReady(() => {
  bindUIEsgt();
  filtrerEsgt();
});



        </script>
