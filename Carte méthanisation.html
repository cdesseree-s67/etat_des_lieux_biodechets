        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

                        <th scope="row">Gisement indicatif</th>\

                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_Biodconditionneurs_7_0(feature) {
            var context = {
                feature: feature,
                variables: {}
            };
            // Start of if blocks and style check logic
            if (exp_Biodconditionneurs_7rule0_eval_expression(context)) {
                  return {
                pane: 'pane_Biodconditionneurs_7',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '2.0,1.0',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(0,175,254,1.0)',
                interactive: true,
            };
                }
                else if (exp_Biodconditionneurs_7rule1_eval_expression(context)) {
                  return {
                pane: 'pane_Biodconditionneurs_7',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(0,175,254,1.0)',
                interactive: true,
            };
                }
            else {
                return {fill: false, stroke: false};
            }
        }
        map.createPane('pane_Biodconditionneurs_7');
        map.getPane('pane_Biodconditionneurs_7').style.zIndex = 407;
        map.getPane('pane_Biodconditionneurs_7').style['mix-blend-mode'] = 'normal';
        var layer_Biodconditionneurs_7 = new L.geoJson(json_Biodconditionneurs_7, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Biodconditionneurs_7',
            layerName: 'layer_Biodconditionneurs_7',
            pane: 'pane_Biodconditionneurs_7',
            onEachFeature: pop_Biodconditionneurs_7,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_Biodconditionneurs_7_0(feature));
            },
        });
        var cluster_Biodconditionneurs_7 = new L.MarkerClusterGroup({showCoverageOnHover: false,
            spiderfyDistanceMultiplier: 2});
        cluster_Biodconditionneurs_7.addLayer(layer_Biodconditionneurs_7);

        bounds_group.addLayer(layer_Biodconditionneurs_7);
        cluster_Biodconditionneurs_7.addTo(map);
        var overlaysTree = [
        {label: '<b>Méthanisation</b>',  selectAllCheckbox: true, children: [
            {label: 'Biodéconditionneurs<br /><table><tr><td style="text-align: center;"><img src="legend/Biodconditionneurs_7_Projet0.png" /></td><td>Projet</td></tr><tr><td style="text-align: center;"><img src="legend/Biodconditionneurs_7_Biodéconditionneur1.png" /></td><td>Bio-déconditionneur</td></tr></table>', layer: cluster_Biodconditionneurs_7},
            {label: 'Méthaniseurs<br /><table><tr><td style="text-align: center;"><img src="legend/Mthaniseurs_6_Projet0.png" /></td><td>Projet</td></tr><tr><td style="text-align: center;"><img src="legend/Mthaniseurs_6_Agricole1.png" /></td><td>Agricole</td></tr><tr><td style="text-align: center;"><img src="legend/Mthaniseurs_6_Agricolecollectivités2.png" /></td><td>Agricole, collectivités</td></tr><tr><td style="text-align: center;"><img src="legend/Mthaniseurs_6_Agricoleindustriels3.png" /></td><td>Agricole, industriels</td></tr><tr><td style="text-align: center;"><img src="legend/Mthaniseurs_6_Agricoleindustrielscollectivités4.png" /></td><td>Agricole, industriels, collectivités</td></tr><tr><td style="text-align: center;"><img src="legend/Mthaniseurs_6_Industriels5.png" /></td><td>Industriels</td></tr><tr><td style="text-align: center;"><img src="legend/Mthaniseurs_6_Industrielscollectivités6.png" /></td><td>Industriels, collectivités</td></tr></table>', layer: cluster_Mthaniseurs_6},]},
        {label: '<b>Géographie</b>', collapsed: true, selectAllCheckbox: true, children: [
            {label: '<img src="legend/DpartementduBasRhin_2.png" /> Département du Bas-Rhin', layer: layer_DpartementduBasRhin_2},
            {label: '<img src="legend/EPCI_1.png" /> EPCI', layer: layer_EPCI_1},]},
            {label: "Fond de carte : OSM Standard", layer: layer_FonddecarteOSMStandard_0, radioGroup: 'bm' },]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            collapseAll: '▲ Tout réduire',
            expandAll: '▼ Tout déployer',
            collapsed: true,
        });
        lay.addTo(map);
        setBounds();

        // ===== LÉGENDE : forcer ouverture/fermeture au clic uniquement =====
        setTimeout(function() {
            var layerControl = document.querySelector('.leaflet-control-layers');
            if (!layerControl) return;
            var toggle = layerControl.querySelector('.leaflet-control-layers-toggle');
            if (!toggle) return;
            var newToggle = toggle.cloneNode(true);
            toggle.parentNode.replaceChild(newToggle, toggle);
            var isOpen = false;
            newToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                if (isOpen) {
                    layerControl.classList.remove('leaflet-control-layers-expanded');
                    isOpen = false;
                } else {
                    layerControl.classList.add('leaflet-control-layers-expanded');
                    isOpen = true;
                }
            });
            map.getContainer().addEventListener('click', function() {
                if (isOpen) {
                    layerControl.classList.remove('leaflet-control-layers-expanded');
                    isOpen = false;
                }
            });
        }, 300);

        // ===== LOGIQUE FILTRES =====

        // Détermine si un feature est "Projet" (Mise en service === 'Projet') ou "Actif"
        function isProjet(feature) {
            var mise = String(feature.properties['Mise en service'] || '').trim();
            return mise === 'Projet';
        }

        function applyFilters() {
            var showMetha   = document.getElementById('f_methaniseurs').checked;
            var showBiodec  = document.getElementById('f_biodeconditionneurs').checked;
            var showActifs  = document.getElementById('f_actifs').checked;
            var showProjets = document.getElementById('f_projets').checked;

            // --- Méthaniseurs ---
            map.removeLayer(cluster_Mthaniseurs_6);
            cluster_Mthaniseurs_6.clearLayers();
            var countMetha = 0;
            if (showMetha) {
                var geoMetha = new L.geoJson(json_Mthaniseurs_6, {
                    interactive: true,
                    pane: 'pane_Mthaniseurs_6',
                    onEachFeature: pop_Mthaniseurs_6,
                    pointToLayer: function(feature, latlng) {
                        return L.circleMarker(latlng, style_Mthaniseurs_6_0(feature));
                    },
                    filter: function(feature) {
                        var projet = isProjet(feature);
                        // N'afficher que les features dont le type correspond aux cases cochées
                        // Les méthaniseurs ont Type !== 'Bio-déconditionneur'
                        var type = String(feature.properties['Type'] || '').trim();
                        var isBiodec = (type === 'Bio-déconditionneur');
                        if (isBiodec) return false; // réservé à l'autre couche
                        if (projet && !showProjets) return false;
                        if (!projet && !showActifs) return false;
                        return true;
                    }
                });
                cluster_Mthaniseurs_6.addLayer(geoMetha);
                cluster_Mthaniseurs_6.addTo(map);
                if (json_Mthaniseurs_6.features) {
                    json_Mthaniseurs_6.features.forEach(function(f) {
                        var type = String(f.properties['Type'] || '').trim();
                        if (type === 'Bio-déconditionneur') return;
                        var projet = isProjet(f);
                        if (projet && !showProjets) return;
                        if (!projet && !showActifs) return;
                        countMetha++;
                    });
                }
            }

            // --- Biodéconditionneurs ---
            map.removeLayer(cluster_Biodconditionneurs_7);
            cluster_Biodconditionneurs_7.clearLayers();
            var countBiodec = 0;
            if (showBiodec) {
                var geoBiodec = new L.geoJson(json_Biodconditionneurs_7, {
                    interactive: true,
                    pane: 'pane_Biodconditionneurs_7',
                    onEachFeature: pop_Biodconditionneurs_7,
                    pointToLayer: function(feature, latlng) {
                        return L.circleMarker(latlng, style_Biodconditionneurs_7_0(feature));
                    },
                    filter: function(feature) {
                        var type = String(feature.properties['Type'] || '').trim();
                        var isBiodec = (type === 'Bio-déconditionneur');
                        if (!isBiodec) return false; // réservé à l'autre couche
                        var projet = isProjet(feature);
                        if (projet && !showProjets) return false;
                        if (!projet && !showActifs) return false;
                        return true;
                    }
                });
                cluster_Biodconditionneurs_7.addLayer(geoBiodec);
                cluster_Biodconditionneurs_7.addTo(map);
                if (json_Biodconditionneurs_7.features) {
                    json_Biodconditionneurs_7.features.forEach(function(f) {
                        var type = String(f.properties['Type'] || '').trim();
                        if (type !== 'Bio-déconditionneur') return;
                        var projet = isProjet(f);
                        if (projet && !showProjets) return;
                        if (!projet && !showActifs) return;
                        countBiodec++;
                    });
                }
            }

            var total = countMetha + countBiodec;
            document.getElementById('filter-count').textContent = total + ' installation(s) affichée(s)';
        }

        function selectAll() {
            document.querySelectorAll('#filter-body input[type="checkbox"]')
                .forEach(function(cb) { cb.checked = true; });
            applyFilters();
        }

        function deselectAll() {
            document.querySelectorAll('#filter-body input[type="checkbox"]')
                .forEach(function(cb) { cb.checked = false; });
            applyFilters();
        }

        function toggleFilterPanel() {
            var body = document.getElementById('filter-body');
            var icon = document.getElementById('filter-toggle-icon');
            if (body.style.display === 'none') {
                body.style.display = 'block';
                icon.textContent = '▼';
            } else {
                body.style.display = 'none';
                icon.textContent = '▲';
            }
        }

        // Initialisation du compteur au chargement
        window.addEventListener('load', function() {
            var total = 0;
            if (json_Mthaniseurs_6 && json_Mthaniseurs_6.features) {
                json_Mthaniseurs_6.features.forEach(function(f) {
                    var type = String(f.properties['Type'] || '').trim();
                    if (type !== 'Bio-déconditionneur') total++;
                });
            }
            if (json_Biodconditionneurs_7 && json_Biodconditionneurs_7.features) {
                json_Biodconditionneurs_7.features.forEach(function(f) {
                    var type = String(f.properties['Type'] || '').trim();
                    if (type === 'Bio-déconditionneur') total++;
                });
            }
            document.getElementById('filter-count').textContent = total + ' installation(s) affichée(s)';
        });

        </script>
