/* ===== THÈME COMMUN – Biodéchets Bas-Rhin ===== */
html, body, #map {
  width: 100%; height: 100%; margin: 0; padding: 0;
}

#map-title {
  position: absolute;
  top: 12px; left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  background: white;
  padding: 8px 16px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 8px;
  font-family: Arial, sans-serif;
  white-space: nowrap;
  box-shadow: 0 1px 5px rgba(0,0,0,0.3);
}

/* ===== BARRE DE FILTRES ===== */
#filters {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  z-index: 9998;
  background: white;
  border-radius: 0 0 8px 8px;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.2);
  font-family: Arial, sans-serif;
  font-size: 13px;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 14px 14px 14px;
  transition: all 0.25s ease;
  max-width: 90vw;
}

#filters.hidden {
  transform: translateX(-50%) translateY(120%);
  opacity: 0;
  pointer-events: none;
}

/* Header violet (bandeau titre du panneau) */
#filters-header {
  width: 100%;
  background: #4a1a6b;
  color: white;
  padding: 8px 14px;
  border-radius: 8px 8px 0 0;
  font-weight: 700;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
  margin: -10px -14px 6px -14px;
  box-sizing: initial;
}

/* Inputs & selects */
#filters select,
#filters input[type="text"] {
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid #c9b0e0;
  font-family: Arial, sans-serif;
  font-size: 13px;
  outline: none;
  accent-color: #4a1a6b;
}
#filters select:focus,
#filters input[type="text"]:focus {
  border-color: #4a1a6b;
  box-shadow: 0 0 0 2px rgba(74,26,107,0.15);
}

#NAF2Filter { width: 200px; }

/* ===== LISTE TYPE ===== */
#typeContainer { flex: 1; min-width: 220px; }

#typeCheckboxes {
  max-height: 130px;
  overflow-y: auto;
  border: 1px solid #c9b0e0;
  padding: 5px 8px;
  border-radius: 6px;
  background: white;
}

.type-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  margin-bottom: 4px;
}
.type-item input[type="checkbox"] { accent-color: #4a1a6b; }

/* ===== BOUTONS ===== */
#filters button {
  padding: 5px 12px;
  cursor: pointer;
  border: none;
  border-radius: 6px;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: 600;
}

#resetFilters {
  background: #eee; color: #333;
}
#resetFilters:hover { background: #ddd; }

#exportCSV {
  background: #4a1a6b; color: white;
}
#exportCSV:hover { background: #3a1258; }

/* ===== TOGGLE (bouton cacher/montrer) ===== */
#toggleFiltersBtn {

/* ===== COMPTEUR ===== */

        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.update();
                    }, 10);
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = false;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });

// ==========================
// CONFIG
// ==========================
var entreprisesLayer = layer_Industriesdistributionetrestauration_13;
var fieldNAF2 = "NAF2";
var fieldType = "LibelléNA";

// =========================
// STATE GLOBAL
// =========================
const state = {
  naf2: "all",
  types: new Set(),
  search: "",
  data: [],
  filtered: [],
  visible: true
};

// =========================
// BARRE DE FILTRES DYNAMIQUE
// =========================

function syncFiltersWithLayer() {
	const panel = document.getElementById("filters");
	const btn = document.getElementById("toggleFiltersBtn");

	const layerOn = map.hasLayer(entreprisesLayer);

	if (!panel|| !btn) return;
	if (layerOn) {
		panel.style.display = "flex";
		btn.style.display = "block";
	} else {
		panel.style.display = "none";
		btn.style.display = "none";
	}
}

map.on("layeradd layerremove", syncFiltersWithLayer);
setTimeout(syncFiltersWithLayer,500);

// =========================
// INIT FILTRES
// =========================
function initFilters() {

  state.data = [];

  entreprisesLayer.eachLayer(l => {
    state.data.push(l.feature.properties);
  });

  buildTypeOptions();
  bindUI();
  applyFilters();
}

// =========================
// BIND UI
// =========================
function bindUI() {

  document.getElementById("NAF2Filter").addEventListener("change", e => {
    state.naf2 = e.target.value;
    buildTypeOptions();
    applyFilters();
  });

  document.getElementById("searchType").addEventListener("input", e => {
    state.search = e.target.value.toLowerCase();
    renderSearch();
  });

  document.getElementById("resetFilters").addEventListener("click", resetFilters);

  document.getElementById("exportCSV").addEventListener("click", exportCSV);

  document.getElementById("toggleFiltersBtn").addEventListener("click", toggleFilters);
}

// =========================
// RESET
// =========================
function resetFilters() {
  state.naf2 = "all";
  state.types.clear();
  state.search = "";

  document.getElementById("NAF2Filter").value = "all";
  document.getElementById("searchType").value = "";

  buildTypeOptions();
  applyFilters();
}

// =========================
// BUILD TYPE OPTIONS
// =========================
function buildTypeOptions() {

  const container = document.getElementById("typeCheckboxes");
  container.innerHTML = "";

  const filtered = state.data.filter(d =>
    state.naf2 === "all" || d.NAF2 == state.naf2
  );

  const uniques = [...new Map(
    filtered.map(d => [d["LibelléNA"], d])
  ).values()];
uniques.sort((a, b) => {
  const codeA = (a["Code NAF"] || "").toString();
  const codeB = (b["Code NAF"] || "").toString();

  return codeA.localeCompare(codeB, "fr", { numeric: true });
});

  uniques.forEach(d => {

    if (!d["LibelléNA"]) return;


const code = d["Code NAF"] || "";
const lib = d["LibelléNA"] || "";

const label = code ? `${code} - ${lib}` : lib;

    const div = document.createElement("div");
    div.className = "type-item";

    div.innerHTML = `
      <label>
        <input type="checkbox" value="${d["LibelléNA"]}">
        ${label}
      </label>
    `;

    div.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) {
        state.types.add(e.target.value);
      } else {
        state.types.delete(e.target.value);
      }
      applyFilters();
    });

    container.appendChild(div);
  });

  renderSearch();
}

// =========================
// FILTER ENGINE
// =========================
function applyFilters() {

  let count = 0;
  const bounds = [];

  state.filtered = [];

  entreprisesLayer.eachLayer(layer => {

    const p = layer.feature.properties;

    const okNAF = state.naf2 === "all" || p.NAF2 == state.naf2;

    const okType =
      state.types.size === 0 ||
      state.types.has(p["LibelléNA"]);

    if (okNAF && okType) {

      layer.setStyle({ opacity: 1, fillOpacity: 1 });
      layer.setRadius(4);

      state.filtered.push(p);
      count++;

      if (layer.getLatLng) bounds.push(layer.getLatLng());

    } else {
      layer.setStyle({ opacity: 0, fillOpacity: 0 });
      layer.setRadius(0);
    }
  });

  document.getElementById("countResults").textContent =
    `${count.toLocaleString()} entreprises`;

  if (bounds.length) {
    const group = new L.featureGroup(bounds.map(l => L.marker(l)));
    map.fitBounds(group.getBounds(), { padding: [20, 20] });
  }
}

// =========================
// SEARCH FILTER VISIBILITY
// =========================
function renderSearch() {

  document.querySelectorAll("#typeCheckboxes .type-item")
    .forEach(item => {
      const text = item.innerText.toLowerCase();
      item.style.display = text.includes(state.search) ? "" : "none";
    });
}

// =========================
// EXPORT CSV
// =========================
function exportCSV() {

  if (!state.filtered.length) {
    alert("Aucune donnée à exporter");
    return;
  }

  const headers = Object.keys(state.filtered[0]);

  const csv = [
    headers.join(";"),
    ...state.filtered.map(row =>
      headers.map(h =>
        `"${(row[h] ?? "").toString().replace(/"/g, '""')}"`
      ).join(";")
    )
  ].join("\n");

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "export.csv";
  a.click();
}

// =========================
// TOGGLE PANEL
// =========================
function toggleFilters() {

  const panel = document.getElementById("filters");

  state.visible = !state.visible;

  if (state.visible) {
	panel.classList.remove("hidden");
	document.getElementById("toggleFiltersBtn").textContent = "▼";
  } else {
	panel.classList.add("hidden");
	document.getElementById("toggleFiltersBtn").textContent = "▲";
	}
  }

// =========================
// INIT CALL
// =========================
initFilters();
