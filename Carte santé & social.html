<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/L.Control.Locate.min.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">

        <style>
        /* ===== TITRE ===== */
        #titre-carte {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: white;
            padding: 8px 16px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            box-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        /* ===== PANNEAU FILTRES ===== */
        #filter-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9998;
            background: white;
            border-radius: 8px 8px 8px 8px;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.25);
            font-family: Arial, sans-serif;
            font-size: 13px;
            width: 340px;
            max-height: calc(60vh);
            display: flex;
            flex-direction: column-reverse;
        }
        #filter-header {
            background: #4a1a6b;
            color: white;
            padding: 10px 14px;
            border-radius: 0 0 8px 8px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            flex-shrink: 0;
        }
        #filter-header:hover { background: #3a1258; }
        #filter-toggle-icon { font-size: 11px; }
        #filter-body {
            overflow-y: auto;
            padding: 10px 14px 14px 14px;
            border-radius: 8px 8px 0 0;
            border-top: none;
        }
        .filter-section-title {
            font-weight: 700;
            color: #4a1a6b;
            margin: 10px 0 6px 0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e0d0f0;
            padding-bottom: 3px;
        }
        .filter-section-title:first-child { margin-top: 4px; }
        .filter-row {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin: 4px 0;
            line-height: 1.4;
        }
        .filter-row input[type="checkbox"] {
            margin-top: 2px;
            accent-color: #4a1a6b;
            cursor: pointer;
            flex-shrink: 0;
        }
        .filter-row label {
            cursor: pointer;
            color: #333;
        }
        .filter-row label:hover { color: #4a1a6b; }
        .filter-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e0d0f0;
        }
        .filter-btn {
            flex: 1;
            padding: 6px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: Arial, sans-serif;
        }
        .filter-btn-reset  { background: #eee; color: #333; }
        .filter-btn-reset:hover  { background: #ddd; }
        .filter-btn-export  { background: #1a5276; color: white; }
        .filter-btn-export:hover  { background: #154360; }
        .filter-count {
            font-size: 11px;
            color: #888;
            margin-top: 8px;
            text-align: center;
        }
        /* ===== LÉGENDE : ouverture au clic uniquement (désactive le hover natif) ===== */
        .leaflet-control-layers:not(.leaflet-control-layers-expanded):hover .leaflet-control-layers-list {
            display: none !important;
        }
        .leaflet-control-layers-toggle {
            cursor: pointer;
        }
        </style>
        <title>Producteurs de biodéchets – Établissements de santé et social – Bas-Rhin</title>
    </head>
    <body>
        <div id="titre-carte">Producteurs de biodéchets – Établissements de santé et social – Bas-Rhin</div>
        <div id="map"></div>

        <!-- PANNEAU FILTRES -->
        <div id="filter-panel">
            <div id="filter-header" onclick="toggleFilterPanel()">
                🔍 Filtrer par activité
                <span id="filter-toggle-icon">▼</span>
            </div>
            <div id="filter-body">

                <div class="filter-actions">
                    <button class="filter-btn filter-btn-reset"  onclick="selectAll()">Reset</button>
                    <button class="filter-btn filter-btn-export" onclick="exportCSV()">Export CSV</button>
                </div>
                <div class="filter-count" id="filter-count"></div>

                <!-- FILTRE SUEZ -->
                <div class="filter-section-title">Gestionnaire biodéchets</div>
                <select id="SuezFilter" onchange="applyFilters()" style="width:100%;padding:5px 8px;border-radius:6px;border:1px solid #c9b0e0;font-family:Arial,sans-serif;font-size:13px;margin-bottom:6px;">
                  <option value="all">Tous les gestionnaires</option>
                  <option value="Suez">Suez uniquement</option>
                </select>

                <!-- EHPAD -->
                <div class="filter-section-title">EHPAD</div>
                <div class="filter-row">
                    <input type="checkbox" id="f_ehpad" value="EHPAD" onchange="applyFilters()">
                    <label for="f_ehpad">EHPAD</label>
                </div>

                <!-- Hôpitaux & foyers (activités FINESS) -->
                <div class="filter-section-title">Hôpitaux &amp; foyers (Activité FINESS)</div>

                <div class="filter-row">
                    <input type="checkbox" id="f_ch" value="Centre Hospitalier (C.H.)" onchange="applyFilters()">
                    <label for="f_ch">Centre Hospitalier (C.H.)</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_chr" value="Centre Hospitalier Régional (C.H.R.)" onchange="applyFilters()">
                    <label for="f_chr">Centre Hospitalier Régional (C.H.R.)</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_chs" value="Centre Hospitalier Spécialisé lutte Maladies Mentales" onchange="applyFilters()">
                    <label for="f_chs">CH Spécialisé Maladies Mentales</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_csapa" value="Centre soins accompagnement prévention addictologie (CSAPA)" onchange="applyFilters()">
                    <label for="f_csapa">CSAPA</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_eam" value="Etablissement Accueil Médicalisé pour personnes handicapées" onchange="applyFilters()">
                    <label for="f_eam">Etab. Accueil Médicalisé (handicapés)</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_eanm" value="Etablissement Accueil Non Médicalisé pour personnes handicapées" onchange="applyFilters()">
                    <label for="f_eanm">Etab. Accueil Non Médicalisé (handicapés)</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_ep" value="Etablissement de Placement" onchange="applyFilters()">
                    <label for="f_ep">Etablissement de Placement</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_essr" value="Etablissement de santé privé autorisé en SSR" onchange="applyFilters()">
                    <label for="f_essr">Etab. privé autorisé en SSR</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_esld" value="Etablissement de Soins Longue Durée" onchange="applyFilters()">
                    <label for="f_esld">Etab. Soins Longue Durée</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_esm" value="Etablissement de Soins Médicaux" onchange="applyFilters()">
                    <label for="f_esm">Etab. Soins Médicaux</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_esp" value="Etablissement de Soins Pluridisciplinaire" onchange="applyFilters()">
                    <label for="f_esp">Etab. Soins Pluridisciplinaire</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_ets" value="Etablissement de Transfusion Sanguine" onchange="applyFilters()">
                    <label for="f_ets">Etab. Transfusion Sanguine</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_eeaa" value="Etablissement Expérimental Autres Adultes" onchange="applyFilters()">
                    <label for="f_eeaa">Etab. Expérimental Adultes</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_eeep" value="Etablissement Expérimental Enfance Protégée" onchange="applyFilters()">
                    <label for="f_eeep">Etab. Expérimental Enfance Protégée</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_eeah" value="Etablissement Expérimental pour Adultes Handicapés" onchange="applyFilters()">
                    <label for="f_eeah">Etab. Expérimental Adultes Handicapés</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_eeeh" value="Etablissement Expérimental pour Enfance Handicapée" onchange="applyFilters()">
                    <label for="f_eeeh">Etab. Expérimental Enfance Handicapée</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_eeap" value="Etablissement pour Enfants ou Adolescents Polyhandicapés" onchange="applyFilters()">
                    <label for="f_eeap">Etab. Enfants/Ados Polyhandicapés</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_espr" value="Etablissement Sanitaire des Prisons" onchange="applyFilters()">
                    <label for="f_espr">Etab. Sanitaire des Prisons</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_ethermal" value="Etablissement Thermal" onchange="applyFilters()">
                    <label for="f_ethermal">Etablissement Thermal</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_fam" value="Foyer d'Accueil Médicalisé pour Adultes Handicapés (F.A.M.)" onchange="applyFilters()">
                    <label for="f_fam">F.A.M. (Adultes Handicapés)</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_fhah" value="Foyer Hébergement Adultes Handicapés" onchange="applyFilters()">
                    <label for="f_fhah">Foyer Hébergement Adultes Handicapés</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_ftm" value="Foyer Travailleurs Migrants non transformé en Résidence Soc." onchange="applyFilters()">
                    <label for="f_ftm">Foyer Travailleurs Migrants</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_itep" value="Institut Thérapeutique Éducatif et Pédagogique (I.T.E.P.)" onchange="applyFilters()">
                    <label for="f_itep">I.T.E.P.</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_mas" value="Maison d'Accueil Spécialisée (M.A.S.)" onchange="applyFilters()">
                    <label for="f_mas">M.A.S.</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_mecs" value="Maison d'Enfants à Caractère Social" onchange="applyFilters()">
                    <label for="f_mecs">Maison d'Enfants à Caractère Social</label>
                </div>
                <div class="filter-row">
                    <input type="checkbox" id="f_mdn" value="Maison de naissance" onchange="applyFilters()">
                    <label for="f_mdn">Maison de naissance</label>
                </div>

            </div>
        </div>

        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/L.Control.Locate.min.js"></script>
        <script src="js/leaflet-svg-shape-markers.min.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="js/leaflet-measure.js"></script>
        <script src="js/leaflet.markercluster.js"></script>

        <!-- Données géographiques -->
        <script src="data/EPCI_1.js"></script>
        <script src="data/DpartementduBasRhin_2.js"></script>

        <!-- Données santé/social -->
        <script src="data/QGISBDEHPAD.js"></script>
        <script src="data/QGISBDHopitaux.js"></script>

        <script>
        // ===== ALIAS DONNÉES =====
        var json_EHPAD_4           = santesocial1;
        var json_Hpitauxetfoyers_5 = santesocial2;

        // ===== INITIALISATION CARTE =====
        var map = L.map('map', {
            zoomControl: false, maxZoom: 28, minZoom: 1
        }).fitBounds([[48.037747419521914, 6.3464966678394], [49.129580456936665, 9.23247855462383]]);

        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/tomchadwin/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});

        // ===== UTILITAIRES POPUP =====
        function removeEmptyRowsFromPopupContent(content, feature) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var rows = tempDiv.querySelectorAll('tr');
            for (var i = 0; i < rows.length; i++) {
                var td = rows[i].querySelector('td.visible-with-data');
                var key = td ? td.id : '';
                if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                    rows[i].parentNode.removeChild(rows[i]);
                }
            }
            return tempDiv.innerHTML;
        }
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    setTimeout(function() { popup.update(); }, 10);
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

        // ===== CONTRÔLES =====
        var zoomControl = L.control.zoom({ position: 'topleft' }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'
        });
        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].className += ' fas fa-ruler';

        var bounds_group = new L.featureGroup([]);
        function setBounds() {}

        // ===== FOND DE CARTE =====
        map.createPane('pane_FonddecarteOSMStandard_0');
        map.getPane('pane_FonddecarteOSMStandard_0').style.zIndex = 400;
        var layer_FonddecarteOSMStandard_0 = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            pane: 'pane_FonddecarteOSMStandard_0',
            opacity: 1.0,
            attribution: '<a href="https://www.openstreetmap.org/copyright">© OpenStreetMap contributors, CC-BY-SA</a>',
            minZoom: 1, maxZoom: 28, minNativeZoom: 0, maxNativeZoom: 19
        });
        map.addLayer(layer_FonddecarteOSMStandard_0);

        // ===== EPCI =====
        function pop_EPCI_1(feature, layer) {}
        function style_EPCI_1_0() {
            return {
                pane: 'pane_EPCI_1',
                opacity: 1,
                color: 'rgba(74,74,74,1.0)',
                dashArray: '4,4',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_EPCI_1');
        map.getPane('pane_EPCI_1').style.zIndex = 401;
        map.getPane('pane_EPCI_1').style['mix-blend-mode'] = 'normal';
        var layer_EPCI_1 = new L.geoJson(json_EPCI_1, {
            attribution: '',
            interactive: false,
            dataVar: 'json_EPCI_1',
            layerName: 'layer_EPCI_1',
            pane: 'pane_EPCI_1',
            onEachFeature: pop_EPCI_1,
            style: style_EPCI_1_0,
        });
        bounds_group.addLayer(layer_EPCI_1);
        map.addLayer(layer_EPCI_1);

        // ===== DÉPARTEMENT BAS-RHIN =====
        function pop_DpartementduBasRhin_2(feature, layer) {
            var popupContent = '<table>\
                <tr><th scope="row">code_insee</th><td class="visible-with-data" id="code_insee">' + (feature.properties['code_insee'] !== null ? autolinker.link(String(feature.properties['code_insee']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                <tr><th scope="row">nom</th><td class="visible-with-data" id="nom">' + (feature.properties['nom'] !== null ? autolinker.link(String(feature.properties['nom']).replace(/'/g, '\'').toLocaleString()) : '') + '</td></tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) { addClassToPopupIfMedia(content, e.popup); });
            layer.bindPopup(content, { maxHeight: 400 });
        }
        function style_DpartementduBasRhin_2_0() {
            return {
                pane: 'pane_DpartementduBasRhin_2',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 3.0,
                fillOpacity: 0,
                interactive: false,
            }
        }
        map.createPane('pane_DpartementduBasRhin_2');
        map.getPane('pane_DpartementduBasRhin_2').style.zIndex = 402;
        map.getPane('pane_DpartementduBasRhin_2').style['mix-blend-mode'] = 'normal';
        var layer_DpartementduBasRhin_2 = new L.geoJson(json_DpartementduBasRhin_2, {
            attribution: '',
            interactive: false,
            dataVar: 'json_DpartementduBasRhin_2',
            layerName: 'layer_DpartementduBasRhin_2',
            pane: 'pane_DpartementduBasRhin_2',
            onEachFeature: pop_DpartementduBasRhin_2,
            style: style_DpartementduBasRhin_2_0,
        });
        bounds_group.addLayer(layer_DpartementduBasRhin_2);
        map.addLayer(layer_DpartementduBasRhin_2);

        // ===== EHPAD =====
        function pop_EHPAD_4(feature, layer) {
            var p = feature.properties;
            var popupContent = '<table style="font-family:Arial,sans-serif;font-size:13px;border-collapse:collapse;">' +
              '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">SIREN</th><td style="padding:3px 0">' + (p['SIREN'] || '—') + '</td></tr>' +
              '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">SIRET</th><td style="padding:3px 0">' + (p['SIRET'] || '—') + '</td></tr>' +
              '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">Nom</th><td style="padding:3px 0">' + (p['Nom'] || '—') + '</td></tr>' +
              '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">Adresse</th><td style="padding:3px 0">' + (p['Adresse'] || '—') + '</td></tr>' +
              '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">Code NAF</th><td style="padding:3px 0">' + (p['Code NAF'] || '—') + '</td></tr>' +
              '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">Prestataire (NAF 56)</th><td style="padding:3px 0">' + (p['Prestataire (NAF 56)'] || '—') + '</td></tr>' +
              '<tr><th style="text-align:left;padding:3px 8px 3px 0;white-space:nowrap">Gestionnaire biodéchets</th><td style="padding:3px 0">' + (p['Biodéchets'] || '—') + '</td></tr>' +
              '</table>';
            layer.bindPopup(popupContent, { maxHeight: 400 });
        }
        function style_EHPAD_4_0() {
            return {
                pane: 'pane_EHPAD_4',
                shape: 'triangle',
                radius: 4.0,
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(166,50,125,1.0)',
                interactive: true,
            }
        }
        map.createPane('pane_EHPAD_4');
        map.getPane('pane_EHPAD_4').style.zIndex = 404;
        map.getPane('pane_EHPAD_4').style['mix-blend-mode'] = 'normal';
        var layer_EHPAD_4 = new L.geoJson(json_EHPAD_4, {
            attribution: '',
            interactive: true,
            dataVar: 'json_EHPAD_4',
            layerName: 'layer_EHPAD_4',
            pane: 'pane_EHPAD_4',
            onEachFeature: pop_EHPAD_4,
            pointToLayer: function (feature, latlng) {
                return L.shapeMarker(latlng, style_EHPAD_4_0(feature));
            },
        });
        var cluster_EHPAD_4 = new L.MarkerClusterGroup({showCoverageOnHover: false, spiderfyDistanceMultiplier: 2});
        cluster_EHPAD_4.addLayer(layer_EHPAD_4);
        bounds_group.addLayer(layer_EHPAD_4);
        cluster_EHPAD_4.addTo(map);

        // ===== HÔPITAUX ET FOYERS =====
        function pop_Hpitauxetfoyers_5(feature, layer) {
            var p = feature.properties;
            var popupContent = '<table style="font-family:Arial,sans-serif;font-size:13px;border-collapse:collapse;">' +

            if (showEHPAD && json_EHPAD_4.features) {
                json_EHPAD_4.features.forEach(function(f) {
                    if (matchesSuez(f)) totalEHPAD++;
                });
            }
            var totalHop = 0;
            if (json_Hpitauxetfoyers_5.features) {
                json_Hpitauxetfoyers_5.features.forEach(function(f) {
                    var act = String(f.properties['Acivité FINESS'] || '');
                    if ((noneChecked || checked.indexOf(act) !== -1) && matchesSuez(f)) totalHop++;
                });
            }
            document.getElementById('filter-count').textContent =
                (totalEHPAD + totalHop) + ' établissement(s) affiché(s)';
        }

        function selectAll() {
            // Reset : tout décocher = tout afficher
            document.querySelectorAll('#filter-body input[type="checkbox"]')
                .forEach(function(cb) { cb.checked = false; });
            document.getElementById('SuezFilter').value = 'all';
            applyFilters();
        }


        function toggleFilterPanel() {
            var body = document.getElementById('filter-body');
            var icon = document.getElementById('filter-toggle-icon');
            if (body.style.display === 'none') {
                body.style.display = 'block';
                icon.textContent = '▼';
            } else {
                body.style.display = 'none';
                icon.textContent = '▲';
            }
        }

        function exportCSV() {
            var checked = getCheckedValues();
            var noneChecked = checked.length === 0;
            var rows = [];

            // EHPAD
            if ((noneChecked || checked.indexOf('EHPAD') !== -1) && json_EHPAD_4 && json_EHPAD_4.features) {
                json_EHPAD_4.features.forEach(function(f) {
                    var p = Object.assign({}, f.properties);
                    p['Type'] = 'EHPAD';
                    rows.push(p);
                });
            }

            // Hôpitaux & foyers
            if (json_Hpitauxetfoyers_5 && json_Hpitauxetfoyers_5.features) {
                json_Hpitauxetfoyers_5.features.forEach(function(f) {
                    var act = String(f.properties['Acivité FINESS'] || '');
                    if (noneChecked || checked.indexOf(act) !== -1) {
                        var p = Object.assign({}, f.properties);
                        p['Type'] = 'Hôpitaux & foyers';
                        rows.push(p);
                    }
                });
            }

            if (!rows.length) { alert('Aucune donnée à exporter.'); return; }

            var headers = Object.keys(rows[0]);
            var csv = [
                headers.join(';'),
                ...rows.map(function(row) {
                    return headers.map(function(h) {
                        return '"' + (row[h] != null ? String(row[h]).replace(/"/g, '""') : '') + '"';
                    }).join(';');
                })
            ].join('\n');

            var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'export_sante_social.csv';
            a.click();
        }

        // Initialisation du compteur au chargement
        window.addEventListener('load', function() {
            var total = 0;
            if (json_EHPAD_4 && json_EHPAD_4.features) total += json_EHPAD_4.features.length;
            if (json_Hpitauxetfoyers_5 && json_Hpitauxetfoyers_5.features) total += json_Hpitauxetfoyers_5.features.length;
            document.getElementById('filter-count').textContent = total + ' établissement(s) affiché(s)';
            // Panneau replié par défaut
            document.getElementById('filter-body').style.display = 'none';
            document.getElementById('filter-toggle-icon').textContent = '▲';
        });

        </script>
    </body>
</html>
